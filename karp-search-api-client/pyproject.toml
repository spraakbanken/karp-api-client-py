[project]
name = "karp-search-api-client"
version = "v1"
description = "A client library for accessing Karps sökgränssnitt - API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Språkbanken", email = "sb-info@svenska.gu.se" },
]
dependencies = [
  "attrs>=22.2.0",
  "httpx2>=2.0.0,<3.0.0",
  "karp-api-core",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.uv.build-backend]
module-name = "karp_search_api_client"
module-root = ""

[tool.uv.sources]
karp-api-core = { workspace = true }
